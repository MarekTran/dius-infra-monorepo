apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: garage
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: jarvis-tools
  source:
    repoURL: https://datahub-local.github.io/garage-helm
    chart: garage
    targetRevision: 0.2.1
    helm:
      values: |
        # Base configuration with persistent volumes and initial buckets/keys
        garage:
          replicationFactor: "1"
          s3:
            api:
              rootDomain: ".s3.homelab.test"
            web:
              rootDomain: ".web.homelab.test"

        persistence:
          enabled: true
          data:
            storageClass: managed
            size: 10Gi
          meta:
            storageClass: managed-premium
            size: 500Mi

        clusterConfig:
          enabled: true
          layout:
            enabled: true
            zone: dc1
          buckets:
            - name: backups
            - name: media
              public: true
          keys:
            my-key:
              keyId: GK0123456789ABCDEF01234567
              secretKey: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
              buckets:
                - backups
                - media
  destination:
    server: https://kubernetes.default.svc
    namespace: garage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
