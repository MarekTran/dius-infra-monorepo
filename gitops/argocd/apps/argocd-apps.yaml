apiVersion: argoproj.io/v1alpha1                                                                                                               
kind: Application                                                                                                                              
metadata:                                                                                                                                      
  name: argocd-apps                                                                                                                            
  namespace: argocd                                                                                                                            
spec:                                                                                                                                          
  project: jarvis-tools                                                                                                                        
  source:                                                                                                                                      
    repoURL: git@github.com:MarekTran/dius-infra-monorepo.git                                                                                  
    targetRevision: master                                                                                                                     
    path: gitops/argocd/apps                                                                                                                   
  destination:                                                                                                                                 
    server: https://kubernetes.default.svc                                                                                                     
    namespace: argocd                                                                                                                          
  syncPolicy:                                                                                                                                  
    automated:                                                                                                                                 
      prune: false # So argo doesnt kill itself                                                                                                                              
      selfHeal: true