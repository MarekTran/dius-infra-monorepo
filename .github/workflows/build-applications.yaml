name: Build and Push Applications

on:
  push:
    branches: [ "master" ]
    paths:
      - "applications/**"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: dev
    strategy:
      matrix:
        # Add new application folder names here
        app: [coderunner]
      fail-fast: false
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check for changes
      uses: dorny/paths-filter@v3
      id: changes
      with:
        filters: |
          src:
            - 'applications/${{ matrix.app }}/**'

    - name: Login to Docker Registry
      if: steps.changes.outputs.src == 'true'
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.REGISTRY_HOST }}
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}

    - name: Set up Docker Buildx
      if: steps.changes.outputs.src == 'true'
      uses: docker/setup-buildx-action@v3

    - name: Build and push
      if: steps.changes.outputs.src == 'true'
      uses: docker/build-push-action@v5
      with:
        context: applications/${{ matrix.app }}
        push: true
        tags: |
          ${{ secrets.REGISTRY_HOST }}/${{ matrix.app }}:${{ github.sha }}
          ${{ secrets.REGISTRY_HOST }}/${{ matrix.app }}:latest
